# Prosistem.IA — configuração básica de HTTPS 
#
# 1) Troque "seudominio.com.br" pelo seu domínio (nas duas linhas de server_name).
# 2) Envie o portfólio como /var/www/prosistem/index.html
# 3) Copie este arquivo para /etc/nginx/sites-available/prosistem
#    e ative:  sudo ln -s /etc/nginx/sites-available/prosistem /etc/nginx/sites-enabled/
# 4) Teste e recarregue:  sudo nginx -t && sudo systemctl reload nginx
# 5) Gere o certificado (o Certbot adiciona o HTTPS e o redirecionamento sozinho):
#      sudo certbot --nginx -d seudominio.com.br -d www.seudominio.com.br
#    A renovação é automática (timer do Certbot).

server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;

    root /var/www/prosistem;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cabeçalhos de segurança (valem também para a parte HTTPS que o Certbot cria)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}

# Depois do Certbot, o arquivo ganha automaticamente:
#   - listen 443 ssl; + ssl_certificate / ssl_certificate_key
#   - um bloco na porta 80 que redireciona (301) tudo para https://
#
# Opcional: TLS moderno (adicione dentro do bloco 443 gerado pelo Certbot)
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_session_cache shared:SSL:10m;
#   ssl_session_timeout 1d;
